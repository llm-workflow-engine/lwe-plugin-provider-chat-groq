[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lwe-plugin-provider-chat-groq"
dynamic = ["version"]
description = "LWE plugin: Chat Groq Provider plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Chad Phillips", email = "chad@apartmentlines.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "langchain-groq>=1.1.3",
  "groq>=0.37.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-datadir",
    "pip-tools",
    "basedpyright",
    "flake8",
    "black",
]

[project.urls]
Homepage = "https://github.com/llm-workflow-engine/lwe-plugin-provider-chat-groq"
Repository = "https://github.com/llm-workflow-engine/lwe-plugin-provider-chat-groq"

[project.entry-points."lwe_plugins"]
lwe_plugin_provider_chat_groq = "lwe_plugin_provider_chat_groq.plugin:ProviderChatGroq"

[tool.setuptools.dynamic]
version = { attr = "lwe_plugin_provider_chat_groq.version.__version__" }

[tool.setuptools.packages.find]
include = ["lwe_plugin_provider_chat_groq*"]
